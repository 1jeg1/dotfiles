[color]

;; Use pywal.sh in scripts directory to use colors from an image/wallpaper.

[color]
;; Use Pywal's xrdb generated colors
background = ${xrdb:background:#2F343F}
foreground = ${xrdb:foreground:#FFFFFF}
primary = ${xrdb:color1:#E53935}
secondary = ${xrdb:color2:#43A047}
alternate = ${xrdb:color4:#1E88E5}

