#################################
#             Corners           #
#################################
corner-radius = 12;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

#################################
#             Blur              #
#################################
blur = {
  method = "dual_kawase";
  strength = 6;
  background = true;
  background-frame = true;
  background-fixed = true;
};

blur-background-exclude = [
  "window_type = 'dock'",     # Exclude Polybar
  "window_type = 'desktop'",
  "class_g = 'slop'",         # Exclude screenshot selection tools
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#   Transparency / Opacity      #
#################################
active-opacity = 1.0;
inactive-opacity = 0.85;
frame-opacity = 1.0;
inactive-opacity-override = false;

# Exclude certain apps from transparency
opacity-rule = [
  "100:class_g = 'firefox'",  # Keep browser fully opaque
  "100:class_g = 'mpv'",      # Keep video player fully opaque
  "100:fullscreen"            # Keep all fullscreen windows fully opaque
];

#################################
#       Shadows & Fading        #
#################################
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "window_type = 'dock'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
no-fading-openclose = false;
#################################
#       General Settings        #
#################################
backend = "glx";              # Required for dual-kawase blur
vsync = true;                 # Prevents screen tearing
use-damage = true;
